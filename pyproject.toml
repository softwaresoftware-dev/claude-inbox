[project]
name = "claude-inbox"
version = "0.1.0"
description = "Give Claude Code and Claude Desktop an inbox: drop named, ready-to-resume conversations into the local session list."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
claude-inbox = "claude_inbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_inbox"]
